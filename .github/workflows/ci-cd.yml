name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-finance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: change-scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      test_matrix: ${{ steps.scope.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Verify change classification and required gate
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Classify the complete PR merge diff
        id: scope
        run: python3 .github/scripts/ci_scope.py

  fast:
    name: fast-checks
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - run: bash .github/scripts/check_workspaces.sh

  tests:
    name: tests (${{ matrix.suite }})
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - name: Run every workspace suite with native Vitest sharding
        env:
          TEST_WORKSPACES: ${{ toJSON(matrix.workspaces) }}
          TEST_SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workspaces < <(jq -r '.[]' <<<"$TEST_WORKSPACES")
          args=()
          for workspace in "${workspaces[@]}"; do args+=(--workspace "$workspace"); done
          if [[ -n "$TEST_SHARD" ]]; then args+=(-- "--shard=$TEST_SHARD"); fi
          npm run test "${args[@]}"

  build:
    name: build-and-synth
    needs: scope
    if: needs.scope.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - run: python3 -m unittest discover -s infrastructure/scripts -p 'test_*.py'
      - run: npm run build --workspace @finance/web
      - run: npm run synth --workspace @finance/infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: '225989371926'

  quality:
    name: quality
    needs: [scope, fast, tests, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
      - name: Require every validation result or the proved Markdown-only path
        run: bash .github/scripts/quality_gate.sh
        env:
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          SCOPE_RESULT: ${{ needs.scope.result }}
          FAST_RESULT: ${{ needs.fast.result }}
          TEST_RESULT: ${{ needs.tests.result }}
          BUILD_RESULT: ${{ needs.build.result }}

  deploy:
    name: deploy-production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
      ALERT_RECIPIENT_EMAIL: ${{ vars.ALERT_RECIPIENT_EMAIL }}
      AGENT_OWNER_SUB: ${{ vars.AGENT_OWNER_SUB }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::225989371926:role/personal-finance-v1-github-deploy
          aws-region: us-east-2
          role-session-name: personal-finance-github-deploy
      - name: Load Prompt Management DRAFT
        shell: bash
        run: |
          set -euo pipefail
          pointer='/personal-finance-v1/agent/runtime-system-prompt-version-arn'
          active_arn="$(aws ssm get-parameter --name "$pointer" --query Parameter.Value --output text)"
          draft_arn="${active_arn%:*}"
          prompt_json="$(aws bedrock-agent get-prompt --prompt-identifier "$draft_arn" --output json)"
          default_variant="$(jq -er '.defaultVariant' <<<"$prompt_json")"
          prompt_text="$(jq -er --arg name "$default_variant" '.variants[] | select(.name == $name) | .templateConfiguration.text.text' <<<"$prompt_json")"
          prompt_text_part_1="${prompt_text:0:3500}"
          prompt_text_part_2="${prompt_text:3500}"
          prompt_model="$(jq -er '.defaultVariant as $name | .variants[] | select(.name == $name) | .modelId' <<<"$prompt_json")"
          prompt_temperature="$(jq -er '.defaultVariant as $name | .variants[] | select(.name == $name) | .inferenceConfiguration.text.temperature' <<<"$prompt_json")"
          prompt_max_tokens="$(jq -er '.defaultVariant as $name | .variants[] | select(.name == $name) | .inferenceConfiguration.text.maxTokens' <<<"$prompt_json")"
          delimiter="OLBIA_PROMPT_$(date +%s%N)"
          {
            echo "OLBIA_SYSTEM_PROMPT_PART_1<<${delimiter}_1"
            echo "$prompt_text_part_1"
            echo "${delimiter}_1"
            echo "OLBIA_SYSTEM_PROMPT_PART_2<<${delimiter}_2"
            echo "$prompt_text_part_2"
            echo "${delimiter}_2"
            echo "OLBIA_SYSTEM_PROMPT_MODEL_ID=$prompt_model"
            echo "OLBIA_SYSTEM_PROMPT_TEMPERATURE=$prompt_temperature"
            echo "OLBIA_SYSTEM_PROMPT_MAX_TOKENS=$prompt_max_tokens"
          } >> "$GITHUB_ENV"
      - run: npm run build --workspace @finance/web
      - name: Synthesize the reviewed deployment assembly once
        run: npx cdk synth PersonalFinanceV1 --quiet --output cdk.out.recovery
        working-directory: infrastructure
      - name: Adopt DSQL resources retained by a failed rollout
        timeout-minutes: 20
        run: python3 infrastructure/scripts/recover-dsql-resources.py infrastructure/cdk.out.recovery/PersonalFinanceV1.template.json
      - run: >-
          npx cdk diff PersonalFinanceV1 --app cdk.out.recovery
          --parameters PersonalFinanceV1:SesSenderEmail="$SES_SENDER_EMAIL"
          --parameters PersonalFinanceV1:AlertRecipientEmail="$ALERT_RECIPIENT_EMAIL"
          --parameters PersonalFinanceV1:AgentOwnerSub="$AGENT_OWNER_SUB"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTextPart1="$OLBIA_SYSTEM_PROMPT_PART_1"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTextPart2="$OLBIA_SYSTEM_PROMPT_PART_2"
          --parameters PersonalFinanceV1:OlbiaSystemPromptModelId="$OLBIA_SYSTEM_PROMPT_MODEL_ID"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTemperature="$OLBIA_SYSTEM_PROMPT_TEMPERATURE"
          --parameters PersonalFinanceV1:OlbiaSystemPromptMaxTokens="$OLBIA_SYSTEM_PROMPT_MAX_TOKENS"
        working-directory: infrastructure
      - run: >-
          npx cdk deploy PersonalFinanceV1 --app cdk.out.recovery
          --parameters PersonalFinanceV1:SesSenderEmail="$SES_SENDER_EMAIL"
          --parameters PersonalFinanceV1:AlertRecipientEmail="$ALERT_RECIPIENT_EMAIL"
          --parameters PersonalFinanceV1:AgentOwnerSub="$AGENT_OWNER_SUB"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTextPart1="$OLBIA_SYSTEM_PROMPT_PART_1"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTextPart2="$OLBIA_SYSTEM_PROMPT_PART_2"
          --parameters PersonalFinanceV1:OlbiaSystemPromptModelId="$OLBIA_SYSTEM_PROMPT_MODEL_ID"
          --parameters PersonalFinanceV1:OlbiaSystemPromptTemperature="$OLBIA_SYSTEM_PROMPT_TEMPERATURE"
          --parameters PersonalFinanceV1:OlbiaSystemPromptMaxTokens="$OLBIA_SYSTEM_PROMPT_MAX_TOKENS"
          --require-approval never
        working-directory: infrastructure
      - name: Refresh AWS session for DSQL verification
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::225989371926:role/personal-finance-v1-github-deploy
          aws-region: us-east-2
          role-session-name: personal-finance-dsql-verify
      - name: Verify authoritative SQL, financial contracts and evidence
        timeout-minutes: 55
        run: bash infrastructure/scripts/verify-dsql-deployment.sh
