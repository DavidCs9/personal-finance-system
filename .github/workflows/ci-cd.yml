name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      probe_emails:
        description: 'Run Textract probe against real inbound emails in S3'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: personal-finance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -- --runInBand
      - run: npm run check --workspace @finance/web
      - run: npm run check --workspace @finance/infrastructure
      - run: npm run build --workspace @finance/web
      - run: npm run synth --workspace @finance/infrastructure
        env:
          CDK_DEFAULT_ACCOUNT: '225989371926'

  probe-email-textract:
    name: probe-email-textract
    needs: quality
    # OIDC trust is currently main-only until PersonalFinanceCiBootstrap is redeployed
    # with pull_request support. On PRs we still attempt the probe (non-blocking).
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::225989371926:role/personal-finance-v1-github-deploy
          aws-region: us-east-2
          role-session-name: personal-finance-email-textract-probe
      - name: Probe real inbound emails with Textract
        env:
          AWS_REGION: us-east-2
          RAW_EMAIL_BUCKET_NAME: personalfinancev1-rawemailbucket251d8c5c-bf3phs9p4sgg
          RAW_EMAIL_PREFIX: inbound/
        run: |
          set -euo pipefail
          CREDS=$(aws sts assume-role \
            --role-arn "arn:aws:iam::225989371926:role/cdk-hnb659fds-deploy-role-225989371926-us-east-2" \
            --role-session-name email-textract-probe \
            --duration-seconds 3600 \
            --output json)
          export AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .Credentials.AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .Credentials.SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .Credentials.SessionToken)
          npm run probe:email-textract --workspace @finance/infrastructure -- --limit 12
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-textract-probe
          path: /tmp/real-email-textract-probe/
          if-no-files-found: ignore

  deploy:
    name: deploy-production
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SES_SENDER_EMAIL: ${{ vars.SES_SENDER_EMAIL }}
      ALERT_RECIPIENT_EMAIL: ${{ vars.ALERT_RECIPIENT_EMAIL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::225989371926:role/personal-finance-v1-github-deploy
          aws-region: us-east-2
          role-session-name: personal-finance-github-deploy
      - run: npm run build --workspace @finance/web
      - run: >-
          npx cdk diff PersonalFinanceV1
          --parameters PersonalFinanceV1:SesSenderEmail="$SES_SENDER_EMAIL"
          --parameters PersonalFinanceV1:AlertRecipientEmail="$ALERT_RECIPIENT_EMAIL"
          --output cdk.out.github-diff
        working-directory: infrastructure
      - run: >-
          npx cdk deploy PersonalFinanceV1
          --parameters PersonalFinanceV1:SesSenderEmail="$SES_SENDER_EMAIL"
          --parameters PersonalFinanceV1:AlertRecipientEmail="$ALERT_RECIPIENT_EMAIL"
          --require-approval never
          --output cdk.out.github-deploy
        working-directory: infrastructure
